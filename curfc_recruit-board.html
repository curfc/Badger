<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chuo University Rugby Football Club - Team Recruiting Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --pitch-900:#0A1930;
    --pitch-800:#112640;
    --pitch-700:#1A3557;
    --pitch-line:#DCEBF7;
    --chalk:#F5F8FC;
    --chalk-dim:#9FB3CE;
    --gold:#6EC3E8;
    --gold-dim:#3D7FA6;
    --amber:#5DADE2;
    --amber-dim:#336E96;
    --clay:#E0736A;
    --clay-dim:#A34E47;
    --steel:#5D7A9E;
    --steel-dim:#3A506E;
    --card-bg:#132C4A;
    --card-border:#24406B;
    font-family:'Noto Sans JP','Oswald',sans-serif;
  }
  *{box-sizing:border-box;}
  .rb-root{
    background:var(--pitch-900);
    color:var(--chalk);
    border-radius:14px;
    padding:0;
    overflow:hidden;
    border:1px solid var(--card-border);
  }
  .rb-header{
    padding:20px 22px 16px;
    border-bottom:1px solid var(--card-border);
  }
  .rb-brand-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .rb-logo{
    width:56px;
    height:56px;
    flex-shrink:0;
    display:block;
  }
  .rb-brand-text{
    flex:1;
    min-width:0;
  }
  .rb-eyebrow{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--gold);
    text-transform:uppercase;
  }
  .rb-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin:2px 0 14px;
  }
  .rb-title{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.02em;
    color:var(--chalk);
  }
  .rb-year-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .rb-year-select{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--gold);
    border-radius:6px;
    padding:6px 10px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    height:34px;
  }
  .rb-icon-btn{
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--chalk);
    border-radius:6px;
    height:34px;width:34px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:15px;
  }
  .rb-icon-btn:hover{background:var(--card-bg);border-color:var(--gold);color:var(--gold);}
  .rb-labeled-btn{
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--chalk);
    border-radius:6px;
    height:34px;
    padding:0 12px;
    display:flex;align-items:center;gap:6px;
    cursor:pointer;
    font-size:12.5px;
    font-family:'Noto Sans JP',sans-serif;
    white-space:nowrap;
  }
  .rb-labeled-btn i{font-size:15px;}
  .rb-labeled-btn:hover{background:var(--card-bg);border-color:var(--gold);color:var(--gold);}
  .rb-header-divider{
    width:1px;
    height:20px;
    background:var(--card-border);
    margin:0 2px;
  }
  .rb-editor-badge{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--chalk);
    border-radius:6px;
    padding:0 10px;
    height:34px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .rb-editor-badge:hover{border-color:var(--gold);}
  .rb-editor-badge i{font-size:14px;color:var(--gold);}
  .rb-sync-status{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    color:var(--chalk-dim);
    white-space:nowrap;
    max-width:340px;
  }
  .rb-sync-error{white-space:normal;}
  }
  .rb-sync-status i{font-size:13px;}
  .rb-sync-saving .ti-loader-2{animation:rb-spin 0.8s linear infinite;}
  @keyframes rb-spin{ to { transform:rotate(360deg); } }
  .rb-sync-saved i{color:#7ED4A0;}
  .rb-sync-saving i{color:var(--gold);}
  .rb-sync-error{color:var(--clay);}
  .rb-sync-error i{color:var(--clay);}
  .rb-autosave-note{
    font-size:11px;
    color:var(--chalk-dim);
    margin-top:6px;
  }
  .rb-import-msg{
    margin-top:6px;
    font-size:12px;
    color:var(--gold);
  }
  .rb-slots-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .rb-slots{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .rb-slot{
    min-width:38px;height:30px;
    padding:0 5px;
    border:1px solid var(--chalk-dim);
    border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    color:var(--chalk-dim);
    background:transparent;
    border-style:dashed;
  }
  .rb-slot.filled{
    background:var(--gold);
    border-color:var(--gold);
    color:#0A1930;
    border-style:solid;
  }
  .rb-slot-count{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    color:var(--chalk);
    white-space:nowrap;
  }
  .rb-slot-count b{color:var(--gold);font-size:18px;}
  .rb-legend{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .rb-legend-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--chalk);
    margin-right:2px;
  }
  .rb-legend-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:10.5px;
    color:var(--chalk-dim);
  }
  .rb-legend-dot{
    width:9px;height:9px;
    border-radius:50%;
    display:inline-block;
    flex-shrink:0;
  }
  .rb-toolbar{
    display:flex;
    gap:10px;
    padding:14px 22px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--card-border);
    align-items:center;
  }
  .rb-input, .rb-select{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--chalk);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:'Noto Sans JP',sans-serif;
    height:36px;
  }
  .rb-input::placeholder{color:var(--chalk-dim);}
  .rb-input{flex:1;min-width:140px;}
  .rb-select{min-width:110px;}
  .rb-toolbar-row{
    display:flex;
    gap:10px;
  }
  .rb-pos-filter{
    position:relative;
  }
  .rb-pos-filter-btn{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .rb-pos-filter-btn i{font-size:11px;color:var(--chalk-dim);}
  .rb-pos-filter-panel{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    z-index:20;
    background:var(--pitch-800);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:12px;
    width:280px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .rb-pos-filter-hint{
    font-size:10.5px;
    color:var(--chalk-dim);
    margin-bottom:8px;
  }
  .rb-pos-filter-clear{
    background:transparent;
    border:none;
    color:var(--gold);
    font-size:12px;
    cursor:pointer;
    margin-top:8px;
    padding:0;
  }
  .rb-btn{
    background:var(--gold);
    color:#0A1930;
    border:none;
    border-radius:6px;
    padding:0 16px;
    height:36px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.03em;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  .rb-btn:hover{background:#DDB43A;}
  .rb-btn.ghost{
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--chalk);
  }
  .rb-btn.ghost:hover{background:var(--card-bg);}
  .rb-board{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:230px;
    gap:12px;
    padding:16px 22px 22px;
    overflow-x:auto;
  }
  .rb-col{
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:120px;
  }
  .rb-col-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:8px;
    border-bottom:2px solid var(--col-color, var(--steel));
  }
  .rb-col-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:0.04em;
    color:var(--chalk);
  }
  .rb-col-count{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    color:var(--chalk-dim);
    background:var(--card-bg);
    border-radius:10px;
    padding:1px 8px;
  }
  .rb-card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-left:3px solid var(--col-color, var(--steel));
    border-radius:8px;
    padding:10px 11px;
    cursor:pointer;
  }
  .rb-card:hover{border-color:var(--gold);}
  .rb-card-top{
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .rb-jersey{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:12.5px;
    min-width:26px;height:26px;
    padding:0 4px;
    border-radius:4px;
    background:var(--pitch-800);
    color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .rb-card-info{
    flex:1;
    min-width:0;
  }
  .rb-card-name{
    font-weight:700;
    font-size:16px;
    color:var(--chalk);
    line-height:1.3;
  }
  .rb-card-hs{
    font-weight:400;
    color:var(--chalk-dim);
  }
  .rb-card-hw{
    font-size:13.5px;
    font-weight:600;
    color:var(--chalk);
    margin-top:3px;
  }
  .rb-card-sub{
    font-size:11px;
    color:var(--chalk-dim);
    margin-top:2px;
  }
  .rb-rank-badge{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:700;
    padding:3px 9px;
    border-radius:5px;
    flex-shrink:0;
  }
  .rb-rank-S{background:var(--gold);color:#0A1930;}
  .rb-rank-A{background:var(--amber);color:#0A1930;}
  .rb-rank-B{background:var(--steel);color:#0E2137;}
  .rb-rank-C{background:var(--card-border);color:var(--chalk-dim);}
  .rb-empty-col{
    border:1px dashed var(--card-border);
    border-radius:8px;
    padding:16px 8px;
    text-align:center;
    font-size:11px;
    color:var(--chalk-dim);
  }
  .rb-overlay{
    min-height:100px;
    background:rgba(6,15,11,0.72);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px;
  }
  .rb-modal{
    background:var(--pitch-800);
    border:1px solid var(--card-border);
    border-radius:12px;
    width:100%;
    max-width:520px;
    padding:22px 24px 20px;
    color:var(--chalk);
  }
  .rb-modal h3{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:18px;
    margin:0 0 4px;
  }
  .rb-modal .rb-modal-sub{
    font-size:12px;
    color:var(--chalk-dim);
    margin-bottom:16px;
  }
  .rb-field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 12px;
    margin-bottom:12px;
  }
  .rb-field-grid.full{grid-template-columns:1fr;}
  .rb-field label{
    display:block;
    font-size:11px;
    color:var(--chalk-dim);
    margin-bottom:4px;
    font-family:'Oswald',sans-serif;
    letter-spacing:0.03em;
  }
  .rb-field input, .rb-field select, .rb-field textarea{
    width:100%;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--chalk);
    border-radius:6px;
    padding:8px 9px;
    font-size:13px;
    font-family:'Noto Sans JP',sans-serif;
  }
  .rb-field textarea{resize:vertical;min-height:52px;}
  .rb-modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--card-border);
  }
  .rb-modal-actions-right{display:flex;gap:8px;}
  .rb-danger-link{
    background:none;border:none;
    color:var(--clay);
    font-size:12.5px;
    cursor:pointer;
    display:flex;align-items:center;gap:4px;
  }
  .rb-danger-link:hover{color:#E06555;}
  .rb-modal-title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .rb-delete-btn{
    background:transparent;
    border:1px solid var(--clay-dim);
    color:var(--clay);
    border-radius:6px;
    padding:5px 12px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    display:flex;align-items:center;gap:5px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .rb-delete-btn:hover{background:var(--clay); border-color:var(--clay); color:#2A0F0C;}
  .rb-modal-updated{color:var(--chalk-dim);}
  .rb-loading{
    padding:40px;text-align:center;color:var(--chalk-dim);font-size:13px;
  }
  .rb-slot-editor-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .rb-slot-editor-num{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    color:var(--chalk-dim);
    width:18px;
  }
  .rb-slot-editor-row select{flex:1;}
  .rb-importance-group{
    display:flex;
    gap:3px;
    flex-shrink:0;
  }
  .rb-importance-chip{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:5px;
    height:30px;width:30px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    cursor:pointer;
    opacity:0.45;
  }
  .rb-importance-chip:hover{opacity:0.8;}
  .rb-importance-chip.active{
    opacity:1;
    border-color:var(--imp-color, var(--gold));
    background:var(--pitch-800);
    box-shadow:0 0 0 1px var(--imp-color, var(--gold));
  }
  .rb-slot-summary{
    font-size:11.5px;
    color:var(--chalk-dim);
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--card-border);
  }
  .rb-field-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:15px;height:15px;
    border-radius:50%;
    background:var(--gold);
    color:#0A1930;
    font-size:9.5px;
    font-weight:700;
    margin-right:5px;
    vertical-align:1px;
  }
  .rb-pos-group{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .rb-pos-group-label{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:11px;
    color:var(--chalk-dim);
    width:26px;
    flex-shrink:0;
  }
  .rb-pos-chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .rb-pos-chip{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--chalk-dim);
    border-radius:6px;
    padding:6px 12px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }
  .rb-pos-chip:hover:not(.disabled){border-color:var(--gold);color:var(--chalk);}
  .rb-pos-chip.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#0A1930;
  }
  .rb-pos-chip.disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .rb-tag-chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .rb-tag-chip{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--chalk-dim);
    border-radius:6px;
    padding:6px 12px;
    font-family:'Noto Sans JP',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }
  .rb-tag-chip:hover{border-color:var(--tag-color, var(--gold));color:var(--chalk);}
  .rb-tag-chip.active{
    background:var(--tag-color, var(--gold));
    border-color:var(--tag-color, var(--gold));
    color:#0A1930;
  }
  .rb-tag-chip.disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .rb-tag-row{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-top:7px;
  }
  .rb-tag-badge{
    font-size:10px;
    font-weight:600;
    padding:2px 7px;
    border-radius:4px;
    background:rgba(255,255,255,0.08);
    background:color-mix(in srgb, var(--tag-color) 22%, transparent);
    border:1px solid var(--tag-color);
    color:var(--tag-color);
  }
  .rb-card-updated{
    margin-top:7px;
    padding-top:6px;
    border-top:1px solid var(--card-border);
    font-size:9.5px;
    color:var(--chalk-dim);
  }
  @media (max-width:640px){
    .rb-header{padding:14px 14px 12px;}
    .rb-brand-row{gap:9px;}
    .rb-logo{width:36px;height:36px;}
    .rb-eyebrow{font-size:8.5px;letter-spacing:0.1em;}
    .rb-title{font-size:18px;}
    .rb-title-row{margin:1px 0 10px;}
    .rb-year-controls{
      width:100%;
      gap:6px;
      margin-top:10px;
    }
    .rb-year-select{order:1; flex:1 1 auto; font-size:12.5px; padding:6px 8px;}
    .rb-labeled-btn{
      order:2;
      padding:0 10px; height:32px; font-size:0; gap:0; flex:0 0 auto;
    }
    .rb-labeled-btn i{font-size:16px;}
    .rb-btn-label{display:none;}
    .rb-header-divider{display:none;}
    .rb-editor-badge{
      order:4; flex-basis:100%; flex:1 1 auto;
      font-size:11px; height:28px; justify-content:center;
    }
    .rb-sync-status{
      order:4; flex:1 1 auto; justify-content:center;
      font-size:10px;
    }
    .rb-autosave-note{display:none;}
    .rb-slot{min-width:19px;height:25px;font-size:9.5px;}
    .rb-slot-count{font-size:12.5px;}

    .rb-toolbar{
      flex-direction:column;
      align-items:stretch;
      padding:12px 14px;
    }
    .rb-input{width:100%;min-width:0;}
    .rb-pos-filter{width:100%;}
    .rb-pos-filter-btn{width:100%;justify-content:space-between;}
    .rb-select{width:100%;min-width:0;}
    .rb-toolbar-row{
      display:flex;
      gap:8px;
    }
    .rb-toolbar-row > *{flex:1;min-width:0;}
    .rb-btn{width:100%;justify-content:center;}

    .rb-board{
      grid-auto-columns:78vw;
      padding:12px 14px 16px;
      gap:10px;
      scroll-snap-type:x mandatory;
    }
    .rb-col{scroll-snap-align:start;}

    .rb-modal{
      max-width:100%;
      width:100%;
      max-height:92vh;
      overflow-y:auto;
      border-radius:12px;
      padding:16px 16px 14px;
    }
    .rb-overlay{padding:0; align-items:flex-end;}
    .rb-field-grid{grid-template-columns:1fr;}
    .rb-modal-title-row{align-items:center;}
  }
  @media (max-width:600px){
    .rb-field-grid{grid-template-columns:1fr;}
  }
@media (min-width:641px){
    .rb-col{
      max-height:560px;
      overflow-y:auto;
      padding-right:4px;
    }
    .rb-col::-webkit-scrollbar{width:6px;}
    .rb-col::-webkit-scrollbar-thumb{background:var(--card-border); border-radius:3px;}

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useCallback, useRef} = React;

const POSITIONS = [
  {code:'PR1', label:'PR1（プロップ）', num:1, group:'FW'},
  {code:'PR3', label:'PR3（プロップ）', num:3, group:'FW'},

const posOrderIndex = Object.fromEntries(POSITIONS.map((p,i)=>[p.code,i]));

// CTB12/CTB13 and WTB11/WTB14 stay distinct internally (for slot counting),
// but on the board we display them without the trailing number.
function displayCode(code){
  return (code && (code.startsWith('CTB') || code.startsWith('WTB')))
    ? code.replace(/\d+$/, '')
    : code;
}

const AREAS = ['北海道','東北','関東','中部','北陸','関西','中国','四国','九州'];

const IMPORTANCE_LEVELS = [
  {code:'high', label:'最重要', color:'#E0453D', emoji:'🟥'},
  {code:'mid',  label:'重要',   color:'#E8963A', emoji:'🟧'},
  {code:'low',  label:'標準',   color:'#E8D23A', emoji:'🟨'},
];
const importanceMap = Object.fromEntries(IMPORTANCE_LEVELS.map(i=>[i.code,i]));
const DEFAULT_IMPORTANCE = 'mid';

// Recruit-status tags: a player can carry up to 3 at once.
// Order = priority, used to pick the card's accent color when several are set.
const RECRUIT_TAGS = [
  {code:'coach', label:'高校推薦', color:'#E0453D'},
  {code:'headquarters', label:'本部推薦', color:'#4CAF50'},
  {code:'branch', label:'支部推薦', color:'#9ACD32'},
  {code:'first', label:'本人希望', color:'#F5A623'},
];
const RECRUIT_TAG_MAX = 3;
const recruitTagMap = Object.fromEntries(RECRUIT_TAGS.map(t=>[t.code,t]));
function primaryTag(recruitTags){
  if(!recruitTags || !recruitTags.length) return null;
  return RECRUIT_TAGS.find(t=>recruitTags.includes(t.code)) || null;
}

const POS_SPLIT_MAP = {
  PR: ['PR1','PR3'],
  CTB: ['CTB12','CTB13'],
  WTB: ['WTB11','WTB14'],
};
// Direct renames for codes that used to exist under a different name
// (PR2 -> PR3, and FL6/FL7 merged into a single FL position).
const CODE_RENAME_MAP = {
  PR2: 'PR3',
  FL6: 'FL',
  FL7: 'FL',
};
function migrateCode(code, counters){
  let c = code;
  if(POS_SPLIT_MAP[c]){
    const idx = counters[c] || 0;
    counters[c] = idx + 1;
    const opts = POS_SPLIT_MAP[c];
    c = opts[Math.min(idx, opts.length-1)];
  }
  if(CODE_RENAME_MAP[c]) c = CODE_RENAME_MAP[c];
  return c;
}
function migrateCodeList(codes){
  const counters = {};
  const migrated = codes.map(c=>migrateCode(c, counters));
  return migrated.filter((c,i)=>migrated.indexOf(c)===i);
}

const STATUSES = [
  {code:'candidate', label:'候補', color:'#41597A'},
  {code:'contact', label:'候補枠確定', color:'#3E7CB1'},
  {code:'negotiate', label:'交渉中', color:'#4A93C7'},
  {code:'confirmed', label:'推薦決定', color:'#6EC3E8'},
  {code:'passed', label:'見送り', color:'#7C8CA6'},
];
const statusMap = Object.fromEntries(STATUSES.map(s=>[s.code,s]));
const RANKS = ['S','A','B','C'];

const STORAGE_KEY = 'recruits-db-v3';
const LEGACY_KEY_V2 = 'recruits-db-v2';
const LEGACY_KEY = 'recruits-db';

/* ------------------------------------------------------------
   ストレージアダプタ
   ・Supabaseの接続情報（window.SUPABASE_URL / ANON_KEY）が
     設定されていれば Supabase の "app_storage" テーブルを使う
   ・未設定なら、Claude.aiアーティファクト内蔵の window.storage を使う
   どちらも同じ {key, value} の形で返すようにしている
------------------------------------------------------------ */
const sbClient = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
  : null;
const USE_SUPABASE = !!sbClient;

async function sharedGet(key){
  if(sbClient){
    const { data, error } = await sbClient.from('app_storage').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? { key, value: JSON.stringify(data.value) } : null;
  }
  return window.storage.get(key, true);
}
async function sharedSet(key, value){
  if(sbClient){
    const { error } = await sbClient.from('app_storage').upsert({ key, value: JSON.parse(value), updated_at: new Date().toISOString() });
    if(error) throw error;
    return { key, value };
  }
  return window.storage.set(key, value, true);
}
async function personalGet(key){
  if(sbClient){
    try{
      const v = localStorage.getItem('rb_' + key);
      return v !== null ? { key, value: v } : null;
    }catch(e){ return null; }
  }
  return window.storage.get(key, false);
}
async function personalSet(key, value){
  if(sbClient){
    try{ localStorage.setItem('rb_' + key, value); }catch(e){}
    return { key, value };
  }
  return window.storage.set(key, value, false);
}

const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function formatDateTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${mm}/${dd} ${hh}:${mi}`;
}

const DEFAULT_SLOT_CODES = ['PR1','PR3','HO','LO','LO','FL','FL','NO8','SH','SO','CTB12','WTB11','FB'];
const DEFAULT_SLOTS = DEFAULT_SLOT_CODES.map(code=>({code, importance: DEFAULT_IMPORTANCE}));
const CURRENT_YEAR = String(new Date().getFullYear() + (new Date().getMonth() >= 3 ? 1 : 0));

function emptyPlayer(year){
  return {
    id: uid(),
    name:'', highSchool:'', positions:[], height:'', weight:'',
    area:'', recruiter:'', playStyle:'', otherInfo:'', repHistory:'',
    rank:'B', comment:'', status:'candidate', recruitTags:[], year: year, updatedAt:Date.now()
  };
}

function migratePlayer(p){
  if(p.positions){
    return {...p, positions: migrateCodeList(p.positions), otherInfo: p.otherInfo || '', recruitTags: Array.isArray(p.recruitTags) ? p.recruitTags : []};
  }
  return {...p, positions: p.position ? migrateCodeList([p.position]) : ['PR1'], otherInfo: p.otherInfo || '', recruitTags: Array.isArray(p.recruitTags) ? p.recruitTags : []};
}

function migrateSlots(slots){
  if(!slots || !slots.length) return DEFAULT_SLOTS.slice();
  const counters = {};
  if(typeof slots[0] === 'string'){
    return slots.map(code=>({code: migrateCode(code, counters), importance: DEFAULT_IMPORTANCE}));
  }
  return slots.map(s=>({
    code: migrateCode(s.code, counters),
    importance: s.importance && importanceMap[s.importance] ? s.importance : DEFAULT_IMPORTANCE
  }));
}

function normalizeData(raw){
  if(Array.isArray(raw)){
    return {
      version:2,
      players: raw.map(p=>migratePlayer({...p, year: p.year || CURRENT_YEAR})),
      yearSettings: {[CURRENT_YEAR]: DEFAULT_SLOTS.slice()}
    };
  }
  if(raw && raw.players){
    const ys = raw.yearSettings && Object.keys(raw.yearSettings).length
      ? Object.fromEntries(Object.entries(raw.yearSettings).map(([y,slots])=>[y, migrateSlots(slots)]))
      : {[CURRENT_YEAR]: DEFAULT_SLOTS.slice()};
    return {
      version:2,
      players: raw.players.map(migratePlayer),
      yearSettings: ys
    };
  }
  return {version:2, players:[], yearSettings:{[CURRENT_YEAR]: DEFAULT_SLOTS.slice()}};
}

const POS_FILTER_MAX = 8;

function PositionFilterDropdown({value, onChange, max}){
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(()=>{
    const onDocClick = (e) => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDocClick);
    return ()=>document.removeEventListener('mousedown', onDocClick);
  },[]);

  const toggle = (code) => {
    if(value.includes(code)){
      onChange(value.filter(c=>c!==code));
    } else if(value.length < max){
      onChange([...value, code]);
    }
  };

  const summary = value.length === 0
    ? '全ポジション'
    : (value.length <= 2 ? value.map(displayCode).join('・') : `ポジション ${value.length}件`);

  const renderChips = (list) => list.map(p=>{
    const active = value.includes(p.code);
    const disabled = !active && value.length >= max;
    return (
      <button
        type="button"
        key={p.code}
        disabled={disabled}
        className={"rb-pos-chip" + (active ? " active":"") + (disabled ? " disabled":"")}
        onClick={()=>toggle(p.code)}
      >{displayCode(p.code)}</button>
    );
  });

  return (
    <div className="rb-pos-filter" ref={ref}>
      <button type="button" className="rb-select rb-pos-filter-btn" onClick={()=>setOpen(o=>!o)}>
        {summary}
        <i className="ti ti-chevron-down" aria-hidden="true"></i>
      </button>
      {open && (
        <div className="rb-pos-filter-panel">
          <div className="rb-pos-filter-hint">最大{max}つまで選択可（{value.length}/{max}）</div>
          <div className="rb-pos-group">
            <span className="rb-pos-group-label">FW</span>
            <div className="rb-pos-chips">{renderChips(FW_POSITIONS)}</div>
          </div>
          <div className="rb-pos-group">
            <span className="rb-pos-group-label">BK</span>
            <div className="rb-pos-chips">{renderChips(BK_POSITIONS)}</div>
          </div>
          {value.length > 0 && (
            <button type="button" className="rb-pos-filter-clear" onClick={()=>onChange([])}>選択をクリア</button>
          )}
        </div>
      )}
    </div>
  );
}

function App(){
  const [db, setDb] = useState(null);
  const [year, setYear] = useState(CURRENT_YEAR);
  const [search, setSearch] = useState('');
  const [areaFilter, setAreaFilter] = useState('');
  const [posFilter, setPosFilter] = useState([]);
  const [editing, setEditing] = useState(null);
  const [isNew, setIsNew] = useState(false);
  const [saving, setSaving] = useState(false);
  const [slotEditorOpen, setSlotEditorOpen] = useState(false);
  const [importMsg, setImportMsg] = useState('');
  const [syncStatus, setSyncStatus] = useState('idle');
  const [syncError, setSyncError] = useState('');
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [editorName, setEditorName] = useState('');
  const fileInputRef = useRef(null);

  useEffect(()=>{
    (async ()=>{
      try{
        const res = await personalGet('editor-name').catch(()=>null);
        if(res && res.value) setEditorName(res.value);
      }catch(e){}
    })();
  },[]);

  const changeEditorName = async () => {
    const name = prompt('あなたの名前を入力してください（保存内容に記録されます）', editorName || '');
    if(name === null) return;
    const trimmed = name.trim();
    setEditorName(trimmed);
    try{ await personalSet('editor-name', trimmed); }catch(e){}
  };

  const loadData = useCallback(async (silent) => {
    try{
      if(!silent) setSyncStatus('saving');
      let res = await sharedGet(STORAGE_KEY).catch(()=>null);
      if(!res){
        let legacy = await sharedGet(LEGACY_KEY_V2).catch(()=>null);
        if(!legacy){
          legacy = await sharedGet(LEGACY_KEY).catch(()=>null);
        }
        if(legacy && legacy.value){
          const migrated = normalizeData(JSON.parse(legacy.value));
          setDb(migrated);
          setYear(y => y || Object.keys(migrated.yearSettings)[0] || CURRENT_YEAR);
          await sharedSet(STORAGE_KEY, JSON.stringify(migrated));
          setLastSavedAt(Date.now());
          setSyncStatus('saved');
          return;
        }
      }
      const data = res && res.value ? normalizeData(JSON.parse(res.value)) : normalizeData([]);
      setDb(data);
      setYear(y => {
        const years = Object.keys(data.yearSettings);
        if(!years.length) return y;
        if(y && years.includes(y)) return y;
        return years.includes(CURRENT_YEAR) ? CURRENT_YEAR : years[0];
      });
      setSyncStatus(s => silent ? s : 'idle');
    }catch(e){
      if(!silent) setDb(d => d || normalizeData([]));
    }
  },[]);

  useEffect(()=>{ loadData(false); },[loadData]);

  // 他メンバーの更新を拾うため、定期的にバックグラウンドで再取得する
  // （編集モーダルを開いている間は取りに行かない＝入力中のデータを守る）
  useEffect(()=>{
    const iv = setInterval(()=>{
      if(!editing) loadData(true);
    }, 45000);
    return ()=>clearInterval(iv);
  },[editing, loadData]);

  const persist = useCallback(async (next) => {
    setDb(next);
    setSyncStatus('saving');
    try{
      const result = await sharedSet(STORAGE_KEY, JSON.stringify(next));
      if(!result) throw new Error('no result');
      setSyncStatus('saved');
      setLastSavedAt(Date.now());
      setSyncError('');
    }catch(e){
      console.error('保存エラー:', e);
      setSyncStatus('error');
      setSyncError((e && (e.message || e.details || e.hint)) || String(e));
    }
  },[]);

  const savePlayer = async (p) => {
    setSaving(true);
    const stamped = {...p, updatedAt:Date.now(), updatedBy: editorName || p.updatedBy || ''};
    const players = db.players.some(x=>x.id===p.id)
      ? db.players.map(x=>x.id===p.id ? stamped : x)
      : [...db.players, stamped];
    await persist({...db, players});
    setSaving(false);
    setEditing(null);
  };

const duplicatePlayer = async (p) => {
  // 新しいIDを作る（元のIDに "_copy" を付けるなど）
  const newId = p.id + "_copy_" + Date.now();

  // 複写データを作成
  const copied = {
    ...p,
    id: newId,
    updatedAt: Date.now(),
    updatedBy: editorName || p.updatedBy || '',
  };

  // savePlayer と同じ処理
  const players = [...db.players, copied];
  await persist({ ...db, players });

  // 複写後にその選手を編集画面に表示したい場合
  setEditing(copied);
};

  
  const deletePlayer = async (id) => {
    const players = db.players.filter(x=>x.id!==id);
    await persist({...db, players});
    setEditing(null);
  };

  const saveSlots = async (slots) => {
    await persist({...db, yearSettings:{...db.yearSettings, [year]: slots}});
    setSlotEditorOpen(false);
  };

  const addYear = async () => {

    if(!ny) return;
    if(db.yearSettings[ny]){ setYear(ny); return; }

    setYear(ny);
  };

  const exportBackup = () => {
    const payload = {
      backupVersion: 1,
      exportedAt: new Date().toISOString(),
      storageKey: STORAGE_KEY,
      data: db,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `recruit-board-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  };

    if(fileInputRef.current) fileInputRef.current.click();
  };

  const handleImportFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      const raw = (parsed && parsed.data && (parsed.data.players || parsed.data.yearSettings)) ? parsed.data : parsed;
      if(!raw || (!Array.isArray(raw.players) && !raw.yearSettings)){
        setImportMsg('このファイルは対応形式のバックアップではありません');
        return;

      const ok = window.confirm('現在のデータを、このバックアップファイルの内容で上書きします。よろしいですか？');
      if(!ok) return;
      const migrated = normalizeData(raw);
      await persist(migrated);
      const years = Object.keys(migrated.yearSettings);
      if(years.length) setYear(years.includes(year) ? year : (years.includes(CURRENT_YEAR) ? CURRENT_YEAR : years[0]));
      setImportMsg(`復元しました（選手 ${migrated.players.length}名）`);

      setImportMsg('読み込みに失敗しました。ファイルが壊れている可能性があります');

      if(posFilter.length && !p.positions.some(code=>posFilter.includes(code))) return false;
      return true;
    });
  },[yearPlayers, search, areaFilter, posFilter]);

  const targetSlots = (db && db.yearSettings[year]) || DEFAULT_SLOTS;

  const slotFillState = useMemo(()=>{
    const confirmed = yearPlayers.filter(p=>p.status==='confirmed');
    const used = new Set();
    return targetSlots.map(slot=>{
      const code = slot.code;
      const importance = slot.importance || DEFAULT_IMPORTANCE;
      const match = confirmed.find(p => !used.has(p.id) && p.positions.includes(code));
      if(match){ used.add(match.id); return {code, importance, filled:true}; }
      return {code, importance, filled:false};
    });
  },[targetSlots, yearPlayers]);

  const filledCount = slotFillState.filter(s=>s.filled).length;

  if(db === null){
    return <div className="rb-root"><div className="rb-loading">読み込み中…</div></div>;
  }

  return (
  <div className="rb-root">
    <div className="rb-container">

      <button
        className="rb-btn"
        onClick={()=>location.href='curfc_candidates.html'}
        style={{marginBottom:20}}
      >
        候補一覧を見る
      </button>

      <div className="rb-header">

          <div className="rb-brand-text">
        <div className="rb-eyebrow">Chuo University Rugby Football Club</div>
        <div className="rb-title-row">
          <div className="rb-title">Team Recruiting Sheet</div>
          <div className="rb-year-controls">
            <button className="rb-editor-badge" title="あなたの名前を設定" onClick={changeEditorName}>
              <i className="ti ti-user-circle" aria-hidden="true"></i>
              {editorName || '編集者を設定'}
            </button>
            <span className={"rb-sync-status rb-sync-" + syncStatus}>
              {syncStatus==='saving' && <><i className="ti ti-loader-2" aria-hidden="true"></i>保存中…</>}
              {syncStatus==='saved' && <><i className="ti ti-cloud-check" aria-hidden="true"></i>自動保存済み {formatDateTime(lastSavedAt)}</>}
              {syncStatus==='error' && <><i className="ti ti-alert-triangle" aria-hidden="true"></i>保存に失敗しました{syncError ? `：${syncError}` : ''}</>}
              {syncStatus==='idle' && <><i className="ti ti-cloud" aria-hidden="true"></i>自動保存が有効です</>}
            </span>
            <select className="rb-year-select" value={year} onChange={e=>setYear(e.target.value)}>
              {Object.keys(db.yearSettings).sort().map(y=><option key={y} value={y}>{y}年度</option>)}
            </select>
            <button className="rb-labeled-btn" title="他のメンバーの更新を取り込む" onClick={()=>loadData(false)}>
              <i className="ti ti-refresh" aria-hidden="true"></i><span className="rb-btn-label">更新</span>
            </button>
            <button className="rb-labeled-btn" title="年度を追加" onClick={addYear}>
              <i className="ti ti-calendar-plus" aria-hidden="true"></i><span className="rb-btn-label">年度追加</span>
            </button>
            <button className="rb-labeled-btn" title="ポジション枠を編集" onClick={()=>setSlotEditorOpen(true)}>
              <i className="ti ti-settings" aria-hidden="true"></i><span className="rb-btn-label">枠設定</span>
            </button>
            <span className="rb-header-divider"></span>
            <button className="rb-labeled-btn" title="念のための追加バックアップを書き出す（JSON・任意）" onClick={exportBackup}>
              <i className="ti ti-download" aria-hidden="true"></i><span className="rb-btn-label">書き出し</span>
            </button>
            <button className="rb-labeled-btn" title="バックアップから復元する（JSON）" onClick={triggerImport}>
              <i className="ti ti-upload" aria-hidden="true"></i><span className="rb-btn-label">読み込み</span>
            </button>
            <input
              ref={fileInputRef}
              type="file"
              accept="application/json,.json"
              style={{display:'none'}}
              onChange={handleImportFile}
            />
          </div>
        </div>
          </div>
        </div>
        <div className="rb-autosave-note">
          {USE_SUPABASE
            ? 'Supabaseに接続中：入力内容は保存操作なしで自動的に共有保存されます。'
            : '入力内容は保存操作なしで自動的に共有保存されます。JSONバックアップは念のための保険として任意でご利用ください。'}
        </div>
        {importMsg && <div className="rb-import-msg">{importMsg}</div>}
        <div className="rb-slots-row">
          <div className="rb-slots">
            {slotFillState.map((s,i)=>{
              const imp = importanceMap[s.importance] || importanceMap[DEFAULT_IMPORTANCE];
              const posLabel = posMap[s.code] ? posMap[s.code].label : s.code;
              return (
                <div
                  key={i}
                  className={"rb-slot" + (s.filled ? " filled":"")}
                  style={s.filled ? undefined : {borderColor:imp.color, color:imp.color}}
                  title={`${posLabel} ・ ${imp.emoji} ${imp.label}`}
                >
                  {displayCode(s.code)}
                </div>
              );
            })}
          </div>
          <div className="rb-slot-count"><b>{filledCount}</b> / {targetSlots.length} 枠確定（{year}年度）</div>
        </div>
        <div className="rb-legend">
          <span className="rb-legend-title">ポジション優先度</span>
          {IMPORTANCE_LEVELS.map(lv=>(
            <span key={lv.code} className="rb-legend-item"><span className="rb-legend-dot" style={{background:lv.color}}></span>{lv.label}</span>
          ))}
        </div>
        <div className="rb-legend">
          <span className="rb-legend-title">リクルート状況</span>
          {RECRUIT_TAGS.map(t=>(
            <span key={t.code} className="rb-legend-item"><span className="rb-legend-dot" style={{background:t.color}}></span>{t.label}</span>
          ))}
        </div>
      </div>

      <div className="rb-toolbar">
        <input className="rb-input" placeholder="選手名・高校名で検索"
          value={search} onChange={e=>setSearch(e.target.value)} />
        <div className="rb-toolbar-row">
          <select className="rb-select" value={areaFilter} onChange={e=>setAreaFilter(e.target.value)}>
            <option value="">全エリア</option>
            {AREAS.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
          <PositionFilterDropdown value={posFilter} onChange={setPosFilter} max={POS_FILTER_MAX} />
        </div>
        <button className="rb-btn" onClick={()=>{setIsNew(true); setEditing(emptyPlayer(year));}}>
          <i className="ti ti-plus" aria-hidden="true"></i>選手を追加
        </button>
      </div>

      <div className="rb-board">
        {STATUSES.map(st=>{
          const list = filtered
            .filter(p=>p.status===st.code)
            .slice()
            .sort((a,b)=>{
              const oa = posOrderIndex[a.positions[0]] ?? 999;
              const ob = posOrderIndex[b.positions[0]] ?? 999;
              return oa - ob;
            });
          return (
            <div className="rb-col" key={st.code} style={{'--col-color':st.color}}>
              <div className="rb-col-head">
                <span className="rb-col-title">{st.label}</span>
                <span className="rb-col-count">{list.length}</span>
              </div>
              {list.length===0 && <div className="rb-empty-col">なし</div>}
              {list.map(p=>{
                const tag = primaryTag(p.recruitTags);
                return (
                  <div
                    className="rb-card"
                    key={p.id}
                    style={tag ? {borderLeftColor: tag.color} : undefined}
                    onClick={()=>{setIsNew(false); setEditing(p);}}
                  >
                    <div className="rb-card-top">
                      <div className="rb-jersey">{p.positions[0] ? displayCode(p.positions[0]) : '-'}</div>
                      <div className="rb-card-info">
                        <div className="rb-card-name">
                          {p.name || '(未入力)'}{p.highSchool && <span className="rb-card-hs">（{p.highSchool}）</span>}
                        </div>
                        {(p.height || p.weight) && (
                          <div className="rb-card-hw">{p.height ? p.height+'cm' : ''}{p.height && p.weight ? ' / ' : ''}{p.weight ? p.weight+'kg' : ''}</div>
                        )}
                        {p.positions.length > 1 && (
                          <div className="rb-card-sub">{p.positions.map(displayCode).join(' / ')}</div>
                        )}
                        {p.playStyle && (
                          <div className="rb-card-playstyle">{p.playStyle}</div>
                        )}
                      </div>
                      <span className={"rb-rank-badge rb-rank-" + p.rank}>{p.rank}</span>
                    </div>
                    {p.recruitTags && p.recruitTags.length > 0 && (
                      <div className="rb-tag-row">
                        {p.recruitTags.map(tc => recruitTagMap[tc] && (
                          <span key={tc} className="rb-tag-badge" style={{'--tag-color':recruitTagMap[tc].color}}>{recruitTagMap[tc].label}</span>
                        ))}
                      </div>
                    )}
                    {p.updatedAt && (
                      <div className="rb-card-updated">
                        更新: {formatDateTime(p.updatedAt)}{p.updatedBy ? ` ・ ${p.updatedBy}` : ''}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      {editing && (
        <EditModal
          key={editing.id}
          player={editing}
          isNew={isNew}
          saving={saving}
          years={Object.keys(db.yearSettings).sort()}
          onCancel={()=>setEditing(null)}
          onSave={savePlayer}
          onDelete={deletePlayer}
        />
      )}

      {slotEditorOpen && (
        <SlotEditor
          year={year}
          slots={targetSlots}
          onCancel={()=>setSlotEditorOpen(false)}
          onSave={saveSlots}
        />
      )}
    </div>
  );
}

function EditModal({player, isNew, saving, years, onCancel, onSave, onDelete}){
  const [form, setForm] = useState(player);
  const set = (k,v) => setForm(f=>({...f, [k]:v}));

  const renderChips = (list) => list.map(p=>{
    const active = form.positions.includes(p.code);
    const disabled = !active && form.positions.length >= 3;
    return (
      <button
        type="button"
        key={p.code}
        disabled={disabled}
        className={"rb-pos-chip" + (active ? " active":"") + (disabled ? " disabled":"")}
        onClick={()=>{
          if(active){
            set('positions', form.positions.filter(c=>c!==p.code));
          } else if(form.positions.length < 3){
            set('positions', [...form.positions, p.code]);
          }
        }}
      >{p.code}</button>
    );
  });

  return (
    <div className="rb-overlay" onClick={e=>{ if(e.target===e.currentTarget) onCancel(); }}>
      <div className="rb-modal">
        <div className="rb-modal-title-row">
          <h3>{isNew ? '選手を追加' : form.name || '選手情報'}</h3>
          {!isNew && (
            <button className="rb-delete-btn" onClick={()=>onDelete(form.id)}>
              <i className="ti ti-trash" aria-hidden="true"></i>削除
            </button>
          )}
        </div>
        <div className="rb-modal-sub">
          {isNew ? '基本情報とスカウト評価を入力してください' : '選手情報を編集'}
          {!isNew && form.updatedAt && (
            <span className="rb-modal-updated"> ・ 最終更新 {formatDateTime(form.updatedAt)}{form.updatedBy ? `（${form.updatedBy}）` : ''}</span>
          )}
        </div>

        <div className="rb-field-grid" style={{marginBottom:14}}>
          <div className="rb-field">
            <label>対象年度</label>
            <select value={form.year} onChange={e=>set('year', e.target.value)}>
              {years.map(y=><option key={y} value={y}>{y}年度</option>)}
            </select>
          </div>
          <div className="rb-field">
            <label>担当リクルーター</label>
            <input value={form.recruiter} onChange={e=>set('recruiter', e.target.value)} placeholder="担当者名" />
          </div>
        </div>

        <div className="rb-field-grid">
          <div className="rb-field">
            <label><span className="rb-field-num">1</span>エリア</label>
            <select value={form.area} onChange={e=>set('area', e.target.value)}>
              <option value="">選択してください</option>
              {AREAS.map(a=><option key={a} value={a}>{a}</option>)}
            </select>
          </div>
          <div className="rb-field">
            <label><span className="rb-field-num">2</span>氏名</label>
            <input value={form.name} onChange={e=>set('name', e.target.value)} placeholder="山田 太郎" />
          </div>
          <div className="rb-field">
            <label><span className="rb-field-num">3</span>出身高校</label>
            <input value={form.highSchool} onChange={e=>set('highSchool', e.target.value)} placeholder="〇〇高校" />
          </div>
        </div>

        <div className="rb-field" style={{marginBottom:12}}>
          <label><span className="rb-field-num">4</span>ポジション（最大3つまで選択可）</label>
          <div className="rb-pos-group">
            <span className="rb-pos-group-label">FW</span>
            <div className="rb-pos-chips">{renderChips(FW_POSITIONS)}</div>
          </div>
          <div className="rb-pos-group">
            <span className="rb-pos-group-label">BK</span>
            <div className="rb-pos-chips">{renderChips(BK_POSITIONS)}</div>
          </div>
        </div>

        <div className="rb-field-grid">
          <div className="rb-field">
            <label><span className="rb-field-num">5</span>身長 (cm)</label>
            <input value={form.height} onChange={e=>set('height', e.target.value)} placeholder="178" />
          </div>
          <div className="rb-field">
            <label><span className="rb-field-num">6</span>体重 (kg)</label>
            <input value={form.weight} onChange={e=>set('weight', e.target.value)} placeholder="82" />
          </div>
        </div>

        <div className="rb-field-grid full">
          <div className="rb-field">
            <label><span className="rb-field-num">7</span>プレーの特徴</label>
            <textarea value={form.playStyle} onChange={e=>set('playStyle', e.target.value)} placeholder="接点の強さ、突破力、キック精度など" />
          </div>
          <div className="rb-field">
            <label><span className="rb-field-num">8</span>その他情報</label>
            <textarea value={form.otherInfo} onChange={e=>set('otherInfo', e.target.value)} placeholder="記入例：役職、性格、学力など" />
          </div>
          <div className="rb-field">
            <label><span className="rb-field-num">9</span>代表歴等</label>
            <textarea value={form.repHistory} onChange={e=>set('repHistory', e.target.value)} placeholder="U18日本代表候補、県選抜など" />
          </div>
          <div className="rb-field">
            <label><span className="rb-field-num">10</span>強化委員＆リクルーターコメント</label>
            <textarea value={form.comment} onChange={e=>set('comment', e.target.value)} placeholder="評価コメント" />
          </div>
        </div>

        <div className="rb-field-grid">
          <div className="rb-field">
            <label><span className="rb-field-num">11</span>推薦度</label>
            <select value={form.rank} onChange={e=>set('rank', e.target.value)}>
              {RANKS.map(r=><option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          <div className="rb-field">
            <label><span className="rb-field-num">12</span>進捗ステータス</label>
            <select value={form.status} onChange={e=>set('status', e.target.value)}>
              {STATUSES.map(s=><option key={s.code} value={s.code}>{s.label}</option>)}
            </select>
          </div>
        </div>

        <div className="rb-field" style={{marginBottom:12}}>
          <label><span className="rb-field-num">13</span>リクルート状況（最大3つまで選択可）</label>
          <div className="rb-tag-chips">
            {RECRUIT_TAGS.map(t=>{
              const cur = Array.isArray(form.recruitTags) ? form.recruitTags : [];
              const active = cur.includes(t.code);
              const reachedMax = cur.length >= 3;
              const disabled = !active && reachedMax;
              return (
                <button
                  type="button"
                  key={t.code}
                  disabled={disabled}
                  className={"rb-tag-chip" + (active ? " active":"") + (disabled ? " disabled":"")}
                  style={{'--tag-color':t.color}}
                  onClick={()=>{
                    if(active){
                      set('recruitTags', cur.filter(c=>c!==t.code));
                    } else if(!reachedMax){
                      set('recruitTags', [...cur, t.code]);
                    }
                  }}
                >{t.label}</button>
              );
            })}
          </div>
        </div>

        <div className="rb-modal-actions">
          <span></span>
          <div className="rb-modal-actions-right">
            <button className="rb-btn ghost" onClick={onCancel}>キャンセル</button>
            <button className="rb-btn" disabled={saving} onClick={()=>onSave(form)}>
              {saving ? '保存中…' : '保存'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SlotEditor({year, slots, onCancel, onSave}){
  const [rows, setRows] = useState(slots.map(s=>({...s})));

  const setRowCode = (i, code) => setRows(r => r.map((x,idx)=> idx===i ? {...x, code} : x));
  const setRowImportance = (i, importance) => setRows(r => r.map((x,idx)=> idx===i ? {...x, importance} : x));
  const addRow = () => setRows(r => [...r, {code:'PR1', importance: DEFAULT_IMPORTANCE}]);
  const removeRow = (i) => setRows(r => r.filter((_,idx)=>idx!==i));

  const summary = useMemo(()=>{
    const counts = {};
    rows.forEach(row => counts[row.code] = (counts[row.code]||0)+1);
    return POSITIONS.filter(p=>counts[p.code]).map(p=>`${p.code} × ${counts[p.code]}`).join('　');
  },[rows]);
return (
  <div className="rb-overlay" onClick={e=>{ if(e.target===e.currentTarget) onCancel(); }}>
    <div className="rb-modal">
      <img src="images/画像1.gif" alt="エンブレム" style={{ width: '60px', display: 'block', margin: '0 auto' }} /> 

        <h3>{year}年度 ポジション枠設定</h3>
        <div className="rb-modal-sub">獲得したいポジションを枠の数だけ設定し、重要度（🟥最重要／🟧重要／🟨標準）を選んでください</div>

        {rows.map((row, i)=>(
          <div className="rb-slot-editor-row" key={i}>
            <span className="rb-slot-editor-num">{i+1}</span>
            <select value={row.code} onChange={e=>setRowCode(i, e.target.value)}>
              {POSITIONS.map(p=><option key={p.code} value={p.code}>{p.label}</option>)}
            </select>
            <div className="rb-importance-group">
              {IMPORTANCE_LEVELS.map(lv=>(
                <button
                  type="button"
                  key={lv.code}
                  title={lv.label}
                  className={"rb-importance-chip" + (row.importance===lv.code ? " active":"")}
                  style={{'--imp-color':lv.color}}
                  onClick={()=>setRowImportance(i, lv.code)}
                >{lv.emoji}</button>
              ))}
            </div>
            <button className="rb-icon-btn" onClick={()=>removeRow(i)} title="この枠を削除">
              <i className="ti ti-x" aria-hidden="true"></i>
            </button>
          </div>
        ))}

        <button className="rb-btn ghost" onClick={addRow} style={{marginTop:4}}>
          <i className="ti ti-plus" aria-hidden="true"></i>枠を追加
        </button>

        <div className="rb-slot-summary">現在の構成（計{rows.length}枠）：{summary || 'なし'}</div>

        <div className="rb-modal-actions">
          <span></span>
          <div className="rb-modal-actions-right">
            <button className="rb-btn ghost" onClick={onCancel}>キャンセル</button>
            <button className="rb-btn" onClick={()=>onSave(rows)}>保存</button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
